<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNILUS CareConnect · Student profile</title>
<link rel="manifest" href="../../manifest.json"><meta name="theme-color" content="#134f47">
<link rel="stylesheet" href="../../Frontend_Material/Shared/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head><body>
<noscript><p style="padding:20px;font-family:sans-serif">CareConnect needs JavaScript. Open this page in Safari or Chrome.</p></noscript>
<div class="phone" id="phone"></div>
<script src="../../Frontend_Material/Shared/core.js"></script>
<script src="../../Frontend_Material/Shared/care_data.js"></script>
<script src="../../Frontend_Material/Shared/emergency_hotline.js"></script>
<script src="../../Frontend_Material/Shared/password_tools.js"></script>
<script src="../../Frontend_Material/Shared/wellbeing_checkin.js"></script>
<script src="../../Frontend_Material/Shared/masked_call.js"></script>
<script>
// Me: profile, upcoming session (check-in/out, call, reschedule), wellbeing check-in.
function view(){
 const hi=S.hist.length?S.hist.map(h=>`<div class="row"><span>Check-in ${h.i}</span><b>${h.s}/27</b></div>`).join(''):'<div class="small">No check-ins yet.</div>';
 const followupAvailable=S.booked&&S.bookingStatus==='approved'&&(S.mode==='Face-to-Face'?!!S.cout:S.mode==='Voice Call'&&S.callCompleted);
 const callAvailable=S.booked&&S.bookingStatus==='approved'&&S.mode==='Voice Call'&&typeof S.why==='string'&&S.why.trim().length>=5;
 const sessionHistory=(S.sessionHistory||[]).map((session,i)=>`<div class="row"><span>Completed session ${i+1}<div class="small">${session.slot||'Time to be arranged'} · ${session.mode} · ${session.cns}</div></span></div>`).join('');
 return `<div class="hero" style="display:flex;gap:12px;align-items:center"><img src="Profile-removebg-preview.png" alt="Profile" class="prof-me"><div><b>Anonymous student</b><div class="small" style="color:#14312d">${S.fac||'UNILUS'}${S.yr?' · Year '+S.yr:''}${S.camp?' · '+S.camp:''}</div></div></div>`+
 (S.bookingStatus==='denied'?`<div class="card" style="background:#fbeeea;border-color:#e8c4b9"><h3 style="color:var(--r)">Request not approved</h3><div class="small">Your counsellor could not approve this ${S.mode} request. You can submit another request or choose a different support option.</div><button class="btn r" data-a="support">Make another request</button></div>`
 :S.booked?`<div class="card" style="border-color:var(--t)">${S.bookingStatus==='pending'?'':'<div class="small">'+(followupAvailable?'Completed session':'Upcoming session')+'</div>'}<h3 style="font-size:16px">${S.bookingStatus==='pending'?'Waiting for counsellor approval':followupAvailable?'Counselling session complete':'Counselling session confirmed'}</h3><div class="small">${S.mode==='Face-to-Face'?S.slot:'Time to be arranged with counsellor'} · ${S.mode} · ${S.cns}</div>${S.bookingStatus==='pending'?'<div class="small" style="margin-top:8px">Your counsellor will review your request. You will be able to arrange a time after it is approved.</div>':''}<button class="btn" data-a="details">View session details</button>${S.bookingStatus==='pending'?'':S.mode==='Face-to-Face'?(!S.cin?'<button class="btn o" data-a="cin">Check in</button>':!S.cout?`<div class="small" style="margin-top:6px">Checked in at ${S.cin}</div><button class="btn o" data-a="cout">Check out</button>`:`<div class="small" style="margin-top:6px">Checked in ${S.cin}, out ${S.cout}</div>`):S.mode==='Voice Call'?(callAvailable?'<button class="btn profile-call-button" data-a="call"><span class="profile-call-icon"><img src="icons8-phone-50.png" alt=""></span><span>Start secure masked call</span></button>':'')+'<button class="btn o" data-a="resched">Reschedule</button>':'<button class="btn o" data-a="resched">Reschedule</button>'}${followupAvailable?'<button class="btn o" data-a="followup">Book a follow-up session</button>':''}${S.bookingStatus==='pending'?'<button class="btn o" data-a="support">Manage request</button>':S.mode==='Face-to-Face'?'<button class="btn o" data-a="resched">Reschedule</button>':''}</div>`
 :`<div class="card" style="background:#fbeeea;border-color:#e8c4b9"><h3 style="color:var(--r)">Need someone to talk to?</h3><button class="btn r" data-a="support">Book appointment now</button></div>`)+
 (sessionHistory?`<div class="card"><h3>Previous sessions</h3>${sessionHistory}</div>`:'')+
 `<div class="card" style="border-color:var(--t)"><h3>Wellbeing self-assessment</h3><div class="small">Non-diagnostic. Tracks how you’re coping over time.</div>${hi}<button class="btn o" data-a="checkin">Take wellbeing check-in</button></div><div class="card"><button class="btn o" data-a="chpw">Change password</button><button class="btn o" data-a="logout">Log out</button></div>`}
const now=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
function act(a){
 if(a==='cin'){S.cin=now();toast('Checked in. Timestamp saved.');render()}
 else if(a==='cout'){S.cout=now();toast('Checked out. Session complete.');render()}
 else if(a==='call')callUI();
 else if(a==='followup'){
  S.followupSession={cat:S.cat,mode:S.mode,why:S.why,cns:S.cns,slot:S.slot,bookingStatus:S.bookingStatus,appointmentDate:S.appointmentDate,appointmentTime:S.appointmentTime,cin:S.cin,cout:S.cout};
  S.followup=true;S.re=false;S.step=0;S.cat='';S.mode='Face-to-Face';S.why='';S.cns='';S.slot='';S.consent=false;S.appointmentDate=S.appointmentTime='';S.calendarMonth='';
  go('support');
 }
 else if(a==='resched'){S.re=true;S.step=4;S.slot='';S.appointmentDate=S.appointmentTime='';S.calendarMonth='';go('support')}
 else if(a==='details')modal(`<h3>Session details</h3><p class="small">${S.mode==='Face-to-Face'?S.slot:'Time to be arranged with counsellor'} · ${S.mode}<br>Counsellor: ${S.cns}${S.mode==='Face-to-Face'?'<br>Location: On-campus clinic<br>Please check in within 15 minutes of start time.':''}${S.why?`<br>Reason: ${S.why}`:''}</p><button class="btn" onclick="close_()">Close</button>`);
 else if(a==='support')go('support');
 else if(a==='checkin')checkin();
}
CC.mount({role:'s',title:'Student profile',nav:'me',root:'../../',view,act});
</script></body></html>
