<div class="quick-access-title">Quick Access</div>
 <div class="quick-access-grid">
 <div class="card-learn"><h3 class="quick-access-card-title"><img src="Vector_Images___Browse_156_929_409_Stock_Photos__Vectors__and_Video-removebg-preview.png" alt="" class="quick-access-icon">Need a moment?</h3><div class="small">Read, watch, play.</div><button class="btn o" data-a="learn">Open wellness toolkit</button></div>
 <div class="card-support"><h3 class="quick-access-card-title"><img src="Vector_Chat_Icon__Chat_Icons__Comment_Icon__Typing_Icon_PNG_and_Vector_with_Transparent_Background_for_Free_Download-removebg-preview.png" alt="" class="quick-access-icon">Talk to a counsellor</h3><div class="small">Face-to-face on campus, or call/chat with a short reason.</div><button class="btn o" data-a="support">Book appointment</button></div>
 </div>`}

CC.mount({role:'s',title:'Home',nav:'home',root:'../../',view,act});
