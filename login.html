<!DOCTYPE html><!-- tells the browser "this is a modern HTML5 page" -->
<html lang="en"><head><meta charset="utf-8"><!-- page language (helps screen readers) / start of the invisible settings area / lets emojis and ’ display correctly -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><!-- makes the page fit phone screens and use the full screen around notches -->
<title>UNILUS CareConnect · Log in</title><!-- the text shown on the browser tab -->
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#134f47"><!-- manifest = lets the page be installed as an app / theme-color = colour of the phone's top bar -->
<link rel="stylesheet" href="Frontend_Material/Shared/styles.css"><!-- FIX: loads the look. Path now matches where the other pages keep Shared (Frontend_Material/Shared) -->
</head><body>
   <button class="back-btn" id="back" type="button">
    <img src="Vector_Back_Icon__Back_Icons__Arrow__Back_PNG_and_Vector_with_Transparent_Background_for_Free_Download-removebg-preview.png" alt="back">
  </button>
<div id="app"></div><!-- empty box. core.js fills it with the form, popups and the emergency button. The id "app" is what core.js looks for. No frame: it has no border, no fixed width and no height limit -->
<noscript><p style="padding:20px;font-family:sans-serif">CareConnect needs JavaScript. Open this page in Safari or Chrome.</p></noscript><!-- shown only when JavaScript is switched off -->
<script src="Frontend_Material/Shared/api.js"></script>
<script src="Frontend_Material/Shared/core.js"></script><!-- FIX: path. Must load FIRST: defines S (saved data), save(), toast(), modal(), render(), ROUTES and CC.mount() -->
<script src="Frontend_Material/Shared/care_data.js"></script><!-- counsellor list, time slots, topics (not used by this page, but every page loads it) -->
<script src="Frontend_Material/Shared/install_app.js"></script><!-- defines installApp(): the "Download app" button action -->
<script src="Frontend_Material/Shared/password_tools.js"></script><!-- defines pwOk(), PWMSG, mkCodes(), inp(), lab(), showCodes(), forceChange() -->
<script>
// everything in this script block is this page's own code
// login.html: log in / create account / forgot password for students, counsellors and the administrator.
// ===== 1. SETTINGS YOU MAY WANT TO CHANGE =====
const STUMAIL=/^[a-z0-9._-]+@stud\.unilus\.ac\.zm$/;                            // the only email shape students may use: letters, digits, . _ - then @stud.unilus.ac.zm. 
const STUMSG='Use your UNILUS student email ending in @stud.unilus.ac.zm.';     // message shown when the student email is not in that shape
const BADL='Incorrect Email or password, or the account is temporarily locked.';   // ONE vague message for every login failure, so nobody can tell whether an email exists
                                                               // wrong passwords allowed before the account is locked
                                                        // how long the lock lasts: 15 minutes in milliseconds (15 x 60 s x 1000)
let loginHistory=['in'];                                                         // tracks the last login screens visited so the back button works reliably

function setLoginMode(mode){                                                     // standard helper for all login links/forms
 const current=loginHistory[loginHistory.length-1];
 if(current!==mode)loginHistory.push(mode);
 close();
 S.lm=mode; render();
}

function goLoginBack(){                                                          // step backwards through login screens
 close();
 if(loginHistory.length>1){loginHistory.pop();S.lm=loginHistory[loginHistory.length-1]||'in';render();return}
 S.lm='in'; render();
}

// ===== 2. THE THREE ROLE BUTTONS: Student | Counsellor | Admin =====
function roleTabs(){                                                            // returns the HTML for the row of 3 buttons
 const tabs=[['s','Student'],['c','Counsellor'],['a','Admin']];                 // [code kept in S.lr, label shown on the button]
 return '<div class="role-tabs">'+                                              // opens the flex row (.role-tabs is in styles.css section 7)
  tabs.map(t=>'<button class="pill role-tab '+(S.lr===t[0]?'on':'')+'" data-lr="'+t[0]+'">'+t[1]+'</button>').join('')+   // one button per tab; class "on" = the selected one (dark green); data-lr tells bindLogin which role it is. FIX: uses the CSS classes instead of inline colours
  '</div>'}                                                                     // closes the row

// ===== 3. BUILDING THE SCREEN (returns HTML text) =====
function loginView(){                                                           // decides which of the 3 forms to show
 const sel=(id,o)=>'<select class="fld" id="'+id+'">'+o.map(x=>{const v=[].concat(x);return '<option value="'+v[0]+'">'+v[v.length-1]+'</option>'}).join('')+'</select>';   // helper that makes a dropdown. Each option is either "text" or ["value","text shown"]
 const inst=matchMedia('(display-mode: standalone)').matches?'':                // if the app is already installed on the home screen, show nothing...
  '<div class="inst-wrap"><button class="inst-button" id="inst" type="button" aria-label="Download app"><img src="Files_Silhouette_Transparent_Background__File_Download_Icon__Download__Icon_PNG_Image_For_Free_Download-removebg-preview.png" alt="Download app" class="inst-icon"></button><span class="inst-label">Download app</span></div>';         // image is the button; label sits underneath
 const stu=S.lr==='s';                                                          // true when the Student tab is selected
 const idl=stu?'Student email':'UNILUS email';                                  // label above the email box
 const lidf=inp('lid',stu?'1234567890@stud.unilus.ac.zm':'name@unilus.edu.zm','email','username');   // the email box (id "lid") with a grey example inside
 const link=(m,t)=>'<button class="link-btn" data-lm="'+m+'">'+t+'</button>';  // helper for text links; data-lm = which form to switch to ("in", "forgot" or "new")
 let b;                                                                         // b will hold the main part of the screen
 if(S.lm==='forgot'){                                                           // ---- FORM 1: reset password ----
  b='<h2>Reset your password</h2>'+                                             // heading
   '<div class="small page-note">Enter your email address and we will send a password-reset link if an eligible account exists.</div>'+
   '<div class="card">'+lab(idl)+lidf+
   '<button class="btn" id="lgo">Send reset link</button></div>'+
                // main button. Every form's main button has id "lgo"; bindLogin() connects it to doLogin()
   link('in','Back to log in')+                                                 // link back to the log in form
   '<div class="small">'+(stu?'Lost your access? Contact the counselling office for help.':'Lost your access? Ask the administrator to reset your password.')+'</div>';   // last-resort advice, different for students and staff
 }else if(S.lm==='new'&&stu){                                                   // ---- FORM 2: create account (students only) ----
  b='<h2>Create your account</h2>'+                                             // heading
   '<div class="small page-note">Register with your UNILUS student email. We will send a verification link before you can log in.</div>'+
   '<div class="card">'+lab('Full name')+inp('lfn','Your full name','text','name')+
   lab('Student email')+lidf+
   lab('Student number')+inp('lsn','Your student number','text','off')+
   lab('Password')+inp('lpw','','password','new-password')+
   '<div class="small field-hint">Use 12 to 72 characters, including at least one letter and one number.</div>'+
   '<button class="btn" id="lgo">Create account</button></div>'+
                // main button
   link('in','I already have an account');                                      // link back to the log in form
 }else{                                                                         // ---- FORM 3: log in (the default) ----
  b='<h2>'+(stu?'Welcome to <span class="brand"><br>CareConnect</br></span>':S.lr==='c'?'Counsellor log in':'Administrator log in')+'</h2>'+   // heading depends on the tab. FIX: the word CareConnect now uses the .brand class (teal) from styles.css
   '<div class="small page-note">'+(stu?'Log in with your student email and password.':'Use your UNILUS email and password. Accounts are created by the administrator.')+'</div>'+   // FIX: said "student ID" but the box needs an email
   '<div class="card">'+lab(idl)+lidf+                                          // white box, email label and email box
   lab('Password')+inp('lpw','','password','current-password')+                 // password label and box (id "lpw")
   '<button class="btn" id="lgo">Log in</button></div>'+                        // main button
   link('forgot','Forgot password?')+(stu?link('new','Create account'):'')+     // "Forgot password?" for everyone, "Create account" for students only
   (stu?'':'<div class="small demo-note">Staff accounts are provisioned by the CareConnect administrator. Use your registered UNILUS email.</div>');   // staff demo logins. DELETE THIS LINE before real students use the app
 }
 return inst+roleTabs()+b}                                                      // final screen = banner + role buttons + the chosen form

// ===== 4. CONNECTING BUTTONS TO ACTIONS (runs after every redraw) =====
function bindLogin(){
 const q=(s,f)=>document.querySelectorAll(s).forEach(f);                        // shortcut: find every element matching s and run f on each
 q('[data-lr]',b=>b.onclick=()=>{S.lr=b.dataset.lr;loginHistory=['in'];S.lm='in';render()});        // role button clicked: remember the role, go back to the log in form, redraw
 q('[data-lm]',b=>b.onclick=()=>setLoginMode(b.dataset.lm));                  // link clicked: switch to that form ("in", "forgot" or "new"), redraw
 q('.fld',f=>f.onkeydown=e=>{if(e.key==='Enter'&&$('lgo'))doLogin()});          // pressing Enter in any box does the same as clicking the main button
 const g=$('lgo');if(g)g.onclick=doLogin;                                       // main button -> doLogin() (the "if" is there because not every screen has it)
 const i=$('inst');if(i)i.onclick=installApp}                                   // "Download app" button -> installApp() (only exists if the banner is shown)

// ===== 5. WRONG-PASSWORD COUNTER =====
function strike(a){                                                             // a = the account that just failed
 a.fails=(a.fails||0)+1;                                                        // add one failed attempt (the "||0" covers accounts with no counter yet)
 if(a.fails>=MAXFAILS){a.lock=Date.now()+LOCKMS;a.fails=0}                      // too many: lock until "now + 15 minutes" and restart the counter
 save()}                                                                        // write it to the browser storage

// ===== 6. THE MAIN BUTTON: log in, create account or reset (depending on the form) =====
async function doLogin(){
 const id=($('lid').value||'').trim().toLowerCase();
 if(S.lr==='s'&&!STUMAIL.test(id))return toast(STUMSG);
 if(S.lr!=='s'&&!/^[^@\s]+@(?:[a-z0-9-]+\.)*unilus\.ac\.zm$/i.test(id))return toast('Use your UNILUS university email address.');
 if(S.lm==='forgot'){
  try{
   await API.forgotPassword(id);
   S.lm='in';loginHistory=['in'];render();
   toast('If an eligible account exists, a password-reset link will be sent to its email address.');
  }catch(error){toast(error.message||'We could not process that request. Please try again.')}
  return;
 }
 const pw=$('lpw')?$('lpw').value:'';
 if(S.lm==='new'){
  const fullName=($('lfn').value||'').trim();
  const studentNumber=($('lsn').value||'').trim();
  if(!fullName)return toast('Enter your full name.');
  if(!studentNumber)return toast('Enter your student number.');
  if(!pwOk(pw))return toast(PWMSG);
  try{
   const result=await API.register({fullName,email:id,studentNumber,password:pw});
   S.lm='in';loginHistory=['in'];render();
   toast(result&&result.message?result.message:'Registration received. Please verify your university email.');
  }catch(error){toast(error.message||'Registration failed. Please check your details and try again.')}
  return;
 }
 if(!pw)return toast('Enter your password.');
 const requestedRole=({s:'STUDENT',c:'COUNSELLOR',a:'ADMIN'})[S.lr];
 try{
  const result=await API.login(id,pw,requestedRole);
  const roles=Array.isArray(result.roles)?result.roles:[];
  if(!roles.includes(requestedRole)){API.logout();return toast('This account is not authorised for the selected portal.');}
  S.me=result.email||id;S.role=S.lr;S.name=S.me;S.in=true;S.cview='dash';save();enter();
 }catch(error){toast(error.message||BADL);}
}

// ===== 7. RESET PASSWORD WITH A RECOVERY CODE =====
// ===== 8. GO TO THE RIGHT AREA AFTER LOGIN =====
function enter(){location.href=ROUTES[S.role]}                                  // ROUTES (core.js) maps s/c/a to a page; the browser jumps there

// ===== 9. START-UP: runs once when the page opens =====
S.lm='in';                                                                      // FIX: always open on the plain log in form (the last form used is saved in the browser and could reopen on "Create account")
S.noClose=false;                                                                // FIX: a popup left open when the tab was closed must not stay stuck
function showLogin(){
 S.in=false;S.role='';S.me='';S.lm='in';S.noClose=false;
 CC.mount({public:true,title:'Welcome',root:'',act(){},view:()=>loginView(),after(){bindLogin()}});
}
if(API.token){
 API.me().then(account=>{
  const roles=Array.isArray(account&&account.roles)?account.roles:[];
  const role=roles.includes('STUDENT')?'s':roles.includes('COUNSELLOR')?'c':roles.includes('ADMIN')?'a':'';
  if(!role||!ROUTES[role]){API.logout();showLogin();return;}
  S.in=true;S.role=role;S.me=account.email||'';S.name=account.fullName||account.email||'';save();enter();
 }).catch(()=>{API.logout();showLogin()});
}else showLogin();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
document.getElementById('back').onclick=()=>{if(S.lm&&S.lm!=='in'){goLoginBack();return}history.length>1?history.back():null};
</script></body></html><!-- end of this page's code / end of the visible page / end of the document -->
