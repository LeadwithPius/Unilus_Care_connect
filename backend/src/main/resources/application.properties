spring.application.name=careconnect

# PostgreSQL database
# Local development defaults are retained; Render supplies production URLs.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/careconnect}
spring.datasource.username=${DB_USERNAME:careconnect_user}
spring.datasource.password=${DB_PASSWORD}

# Keep the application pool small by default for modest hosting plans.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=120000

# JPA and schema validation
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway database migrations.
# In production, set SPRING_FLYWAY_URL to Neon's direct (non-pooler) JDBC URL.
spring.flyway.enabled=true
spring.flyway.url=${SPRING_FLYWAY_URL:${spring.datasource.url}}

# Application server (Render provides PORT).
server.port=${PORT:8080}

# Email configuration
spring.mail.host=${CARECONNECT_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${CARECONNECT_MAIL_PORT:587}
spring.mail.username=${CARECONNECT_MAIL_USERNAME:}
spring.mail.password=${CARECONNECT_MAIL_PASSWORD:}

# Secure SMTP connection
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true

# SMTP timeouts
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

# Password reset
careconnect.password-reset.expiry-minutes=15

# Email verification
careconnect.email-verification.expiry-minutes=30
careconnect.frontend.verification-url=${CARECONNECT_FRONTEND_VERIFICATION_URL:http://localhost:5173/verify-email}

# Initial administrator provisioning
# Disabled by default. Enable only for the first production bootstrap,
# then disable it and remove the bootstrap password from the environment.
careconnect.admin.bootstrap-enabled=${CARECONNECT_ADMIN_BOOTSTRAP_ENABLED:false}
careconnect.admin.email=${CARECONNECT_ADMIN_EMAIL:}
careconnect.admin.password=${CARECONNECT_ADMIN_PASSWORD:}

# JWT authentication
careconnect.jwt.secret=${CARECONNECT_JWT_SECRET}
careconnect.jwt.issuer=${CARECONNECT_JWT_ISSUER:careconnect-api}

# Email verification is required by default.
careconnect.auth.email-verification-required=${CARECONNECT_AUTH_EMAIL_VERIFICATION_REQUIRED:true}

# Comma-separated exact browser origins allowed to call the API.
careconnect.security.cors.allowed-origins=${CARECONNECT_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
