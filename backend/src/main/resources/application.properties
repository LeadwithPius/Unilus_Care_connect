spring.application.name=careconnect

spring.datasource.url=jdbc:postgresql://localhost:5432/careconnect
spring.datasource.username=careconnect_user
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

server.port=8080
# Gmail SMTP configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${CARECONNECT_MAIL_USERNAME:}
spring.mail.password=${CARECONNECT_MAIL_PASSWORD:}

# Secure SMTP connection
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true

# Prevent SMTP operations from hanging indefinitely
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

# Password reset link expiry: 15 minutes
careconnect.password-reset.expiry-minutes=15

# Email verification
careconnect.email-verification.expiry-minutes=30
careconnect.frontend.verification-url=http://localhost:5173/verify-email