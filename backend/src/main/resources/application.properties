spring.application.name=careconnect

# PostgreSQL database
spring.datasource.url=jdbc:postgresql://localhost:5432/careconnect
spring.datasource.username=careconnect_user
spring.datasource.password=${DB_PASSWORD}

# JPA and schema validation
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway database migrations
spring.flyway.enabled=true

# Application server
server.port=8080

# Email configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${CARECONNECT_MAIL_USERNAME:}
spring.mail.password=${CARECONNECT_MAIL_PASSWORD:}

# Secure SMTP connection
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true

# SMTP timeouts
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

# Password reset
careconnect.password-reset.expiry-minutes=15

# Email verification
careconnect.email-verification.expiry-minutes=30
careconnect.frontend.verification-url=http://localhost:5173/verify-email

# Initial administrator provisioning
# Disabled by default.
# Enable temporarily through CARECONNECT_ADMIN_BOOTSTRAP_ENABLED.
careconnect.admin.bootstrap-enabled=${CARECONNECT_ADMIN_BOOTSTRAP_ENABLED:false}
careconnect.admin.email=${CARECONNECT_ADMIN_EMAIL:}
careconnect.admin.password=${CARECONNECT_ADMIN_PASSWORD:}

# JWT authentication
careconnect.jwt.secret=${CARECONNECT_JWT_SECRET}
careconnect.jwt.issuer=${CARECONNECT_JWT_ISSUER:careconnect-api}