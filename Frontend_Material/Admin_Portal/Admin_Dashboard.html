<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>UNILUS CareConnect · Administrator</title>
    <link rel="manifest" href="../../manifest.json">
    <meta name="theme-color" content="#134f47">
    <link rel="stylesheet" href="../Shared_Material/styles.css">

    <style>
        /* Admin-only dashboard styles. */
        .admin-heading {
            margin-bottom: 6px;
        }

        .admin-subtitle {
            color: #667772;
            font-size: 13px;
            line-height: 1.6;
            margin: 0 0 18px;
        }

        .report-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin: 14px 0;
        }

        .report-stat {
            min-width: 0;
            background: #fff;
            border: 1px solid #e1eae6;
            border-radius: 15px;
            padding: 15px 13px;
            box-shadow: 0 4px 14px rgba(19, 79, 71, .045);
            transition: transform .18s ease, box-shadow .18s ease;
        }

        .report-stat:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(19, 79, 71, .09);
        }

        .report-stat-label {
            display: block;
            color: #687a74;
            font-size: 11px;
            font-weight: 700;
            line-height: 1.5;
            text-transform: uppercase;
            letter-spacing: .045em;
        }

        .report-stat-value {
            display: block;
            margin-top: 8px;
            color: #134f47;
            font-size: 25px;
            font-weight: 800;
            line-height: 1.2;
        }

        .report-stat-note {
            display: block;
            margin-top: 7px;
            color: #75847e;
            font-size: 11px;
            line-height: 1.5;
        }

        .report-icon {
            display: flex;
            width: 35px;
            height: 35px;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            border-radius: 11px;
            background: #eaf3ef;
            color: #134f47;
            font-size: 17px;
        }

        .report-status {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid #e9d9a7;
            border-radius: 12px;
            background: #fff9e9;
            color: #765a1a;
            font-size: 12px;
            line-height: 1.6;
        }

        .report-status strong {
            display: block;
            margin-bottom: 2px;
        }

        .report-status-dot {
            flex: 0 0 8px;
            width: 8px;
            height: 8px;
            margin-top: 5px;
            border-radius: 50%;
            background: #d6a334;
        }

        .report-filters {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin: 14px 0;
        }

        .report-field label {
            display: block;
            margin-bottom: 5px;
            color: #53665f;
            font-size: 12px;
            font-weight: 700;
        }

        .report-field select,
        .report-field input {
            box-sizing: border-box;
            width: 100%;
            min-height: 43px;
            padding: 10px;
            border: 1px solid #d7e3dd;
            border-radius: 10px;
            background: #fff;
            color: #243d35;
            font: inherit;
            font-size: 13px;
        }

        .report-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .report-actions .btn {
            flex: 1 1 130px;
        }

        .report-table-wrap {
            width: 100%;
            overflow-x: auto;
            margin-top: 12px;
            border: 1px solid #e2eae6;
            border-radius: 12px;
        }

        .report-table {
            width: 100%;
            min-width: 420px;
            border-collapse: collapse;
            font-size: 12px;
            text-align: left;
        }

        .report-table th {
            padding: 12px 10px;
            background: #edf4f0;
            color: #37594d;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        .report-table td {
            padding: 12px 10px;
            border-top: 1px solid #edf1ee;
            color: #344c42;
        }

        .report-table tbody tr:hover {
            background: #f8fbf9;
        }

        .report-empty {
            padding: 18px !important;
            color: #687a74 !important;
            text-align: center;
        }

        .report-chart {
            margin-top: 12px;
        }

        .report-bar-row {
            margin: 16px 0;
        }

        .report-bar-heading {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 7px;
            font-size: 12px;
        }

        .report-bar-heading span:first-child {
            color: #41584e;
        }

        .report-bar-heading strong {
            color: #134f47;
        }

        .report-bar-track {
            height: 9px;
            overflow: hidden;
            border-radius: 20px;
            background: #eaf0ec;
        }

        .report-bar-fill {
            height: 100%;
            width: 0;
            border-radius: inherit;
            background: linear-gradient(90deg, #134f47, #59a68c);
            transition: width .35s ease;
        }

        .report-footnote {
            margin-top: 12px;
            color: #6c7b75;
            font-size: 11px;
            line-height: 1.6;
        }

        .report-section-title {
            margin: 0 0 5px;
            color: #21483b;
            font-size: 16px;
        }

        .report-section-description {
            margin: 0;
            color: #728078;
            font-size: 12px;
            line-height: 1.6;
        }

        .report-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 20px;
            background: #edf4f0;
            color: #315b49;
            font-size: 10px;
            font-weight: 700;
        }

        .report-divider {
            height: 1px;
            margin: 16px 0;
            background: #e7eeea;
            border: 0;
        }

        @media (min-width: 560px) {
            .report-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .report-filters {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media print {
            body {
                background: #fff !important;
            }

            .phone {
                width: 100% !important;
                max-width: none !important;
                box-shadow: none !important;
                border: 0 !important;
            }

            .report-actions,
            .report-filters,
            [data-a="logout"],
            [data-a="chpw"],
            #counsellor-management {
                display: none !important;
            }

            .report-stat,
            .card {
                break-inside: avoid;
                box-shadow: none !important;
            }
        }
    </style>
</head>

<body>
<noscript>
    <p style="padding:20px;font-family:sans-serif">
        CareConnect needs JavaScript. Open this page in Safari or Chrome.
    </p>
</noscript>

<div class="phone" id="phone"></div>

<script src="../Shared_Material/api.js"></script>
<script src="../Shared_Material/core.js"></script>
<script src="../Shared_Material/care_data.js"></script>
<script src="../Shared_Material/emergency_hotline.js"></script>
<script src="../Shared_Material/password_tools.js"></script>

<script>
    /*
     * CareConnect administrator dashboard.
     *
     * Scope: this file only.
     *
     * Important:
     * The original campus figures are demonstration data. They are retained
     * for the anonymised campus report, clearly labelled as illustrative.
     * Appointment and student totals display as unavailable until a real
     * reporting endpoint is connected.
     */

    const ADMIN_CAMPUS_REPORT = [
        {
            campus: 'Leopards Hill',
            faculty: 'Business',
            year: 'Year 2',
            count: 12
        },
        {
            campus: 'Leopards Hill',
            faculty: 'Tech & Sciences',
            year: 'Year 3',
            count: 9
        },
        {
            campus: 'Pioneer',
            faculty: 'Mass Media',
            year: 'Year 4',
            count: 3
        },
        {
            campus: 'Silverest',
            faculty: 'Education',
            year: 'Year 1',
            count: 2
        }
    ];

    const ADMIN_REPORT_STATE = {
        campus: 'all',
        faculty: 'all',
        search: ''
    };

    function adminEscape(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        })[char]);
    }

    function adminGetFilteredRows() {
        const search = ADMIN_REPORT_STATE.search.trim().toLowerCase();

        return ADMIN_CAMPUS_REPORT.filter(row => {
            const campusMatches =
                ADMIN_REPORT_STATE.campus === 'all' ||
                row.campus === ADMIN_REPORT_STATE.campus;

            const facultyMatches =
                ADMIN_REPORT_STATE.faculty === 'all' ||
                row.faculty === ADMIN_REPORT_STATE.faculty;

            const searchMatches =
                !search ||
                row.campus.toLowerCase().includes(search) ||
                row.faculty.toLowerCase().includes(search) ||
                row.year.toLowerCase().includes(search);

            return campusMatches && facultyMatches && searchMatches;
        });
    }

    function adminMaskedCount(count) {
        return count < 5 ? 'Suppressed (<5)' : count + ' students';
    }

    function adminCampusOptions() {
        const campuses = [...new Set(ADMIN_CAMPUS_REPORT.map(row => row.campus))];

        return '<option value="all">All campuses</option>' +
            campuses.map(campus =>
                `<option value="${adminEscape(campus)}" ${
                    ADMIN_REPORT_STATE.campus === campus ? 'selected' : ''
                }>${adminEscape(campus)}</option>`
            ).join('');
    }

    function adminFacultyOptions() {
        const faculties = [...new Set(ADMIN_CAMPUS_REPORT.map(row => row.faculty))];

        return '<option value="all">All faculties</option>' +
            faculties.map(faculty =>
                `<option value="${adminEscape(faculty)}" ${
                    ADMIN_REPORT_STATE.faculty === faculty ? 'selected' : ''
                }>${adminEscape(faculty)}</option>`
            ).join('');
    }

    function adminReportTable() {
        const rows = adminGetFilteredRows();

        if (!rows.length) {
            return `
                <tr>
                    <td colspan="4" class="report-empty">
                        No groups match your filters.
                    </td>
                </tr>
            `;
        }

        return rows.map(row => `
            <tr>
                <td>${adminEscape(row.campus)}</td>
                <td>${adminEscape(row.faculty)}</td>
                <td>${adminEscape(row.year)}</td>
                <td>${adminEscape(adminMaskedCount(row.count))}</td>
            </tr>
        `).join('');
    }

    function adminReportBars() {
        const rows = adminGetFilteredRows();
        const maximum = Math.max(1, ...rows.map(row => row.count));

        if (!rows.length) {
            return '<p class="report-footnote">No data available for these filters.</p>';
        }

        return rows.map(row => {
            const width = Math.round((row.count / maximum) * 100);
            const visibleCount = row.count < 5
                ? 'Suppressed'
                : row.count + ' students';

            return `
                <div class="report-bar-row">
                    <div class="report-bar-heading">
                        <span>${adminEscape(row.campus)} · ${adminEscape(row.faculty)}</span>
                        <strong>${adminEscape(visibleCount)}</strong>
                    </div>
                    <div class="report-bar-track"
                         role="progressbar"
                         aria-label="${adminEscape(row.campus)} ${adminEscape(row.faculty)}"
                         aria-valuemin="0"
                         aria-valuemax="${maximum}"
                         aria-valuenow="${row.count}">
                        <div class="report-bar-fill" style="width:${width}%"></div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function adminReportsMarkup() {
        return `
            <section class="card" id="reports-analytics">
                <h3 class="admin-heading">Reports &amp; Analytics</h3>
                <p class="admin-subtitle">
                    Monitor CareConnect activity and prepare anonymised reports.
                </p>

                <div class="report-status" role="status">
                    <span class="report-status-dot"></span>
                    <div>
                        <strong>Live reporting data is not connected</strong>
                        Student totals, appointment totals and session totals
                        require a reporting API. They are intentionally not
                        replaced with invented figures.
                    </div>
                </div>

                <div class="report-grid" aria-label="CareConnect summary statistics">
                    <div class="report-stat">
                        <div class="report-icon" aria-hidden="true">&#128100;</div>
                        <span class="report-stat-label">Total students</span>
                        <strong class="report-stat-value">—</strong>
                        <span class="report-stat-note">Waiting for live data</span>
                    </div>

                    <div class="report-stat">
                        <div class="report-icon" aria-hidden="true">&#128197;</div>
                        <span class="report-stat-label">Appointments</span>
                        <strong class="report-stat-value">—</strong>
                        <span class="report-stat-note">Waiting for live data</span>
                    </div>

                    <div class="report-stat">
                        <div class="report-icon" aria-hidden="true">&#10003;</div>
                        <span class="report-stat-label">Completed sessions</span>
                        <strong class="report-stat-value">—</strong>
                        <span class="report-stat-note">Waiting for live data</span>
                    </div>

                    <div class="report-stat">
                        <div class="report-icon" aria-hidden="true">&#9201;</div>
                        <span class="report-stat-label">Pending appointments</span>
                        <strong class="report-stat-value">—</strong>
                        <span class="report-stat-note">Waiting for live data</span>
                    </div>
                </div>

                <hr class="report-divider">

                <h3 class="report-section-title">Campus distribution</h3>
                <p class="report-section-description">
                    Demonstration dataset only. Counts below are illustrative,
                    not live CareConnect database totals.
                </p>

                <div class="report-filters">
                    <div class="report-field">
                        <label for="admin-campus-filter">Campus</label>
                        <select id="admin-campus-filter">
                            ${adminCampusOptions()}
                        </select>
                    </div>

                    <div class="report-field">
                        <label for="admin-faculty-filter">Faculty</label>
                        <select id="admin-faculty-filter">
                            ${adminFacultyOptions()}
                        </select>
                    </div>

                    <div class="report-field">
                        <label for="admin-report-search">Search report</label>
                        <input
                            id="admin-report-search"
                            type="search"
                            placeholder="Search campus, faculty or year"
                            value="${adminEscape(ADMIN_REPORT_STATE.search)}"
                        >
                    </div>
                </div>

                <div class="report-actions">
                    <button class="btn" type="button" data-admin-report="csv">
                        Export CSV
                    </button>
                    <button class="btn o" type="button" data-admin-report="print">
                        Print report
                    </button>
                    <button class="btn o" type="button" data-admin-report="reset">
                        Reset filters
                    </button>
                </div>

                <div class="report-chart" aria-label="Campus distribution chart">
                    ${adminReportBars()}
                </div>

                <div class="report-table-wrap">
                    <table class="report-table">
                        <thead>
                            <tr>
                                <th>Campus</th>
                                <th>Faculty</th>
                                <th>Year</th>
                                <th>Reported group</th>
                            </tr>
                        </thead>
                        <tbody id="admin-report-rows">
                            ${adminReportTable()}
                        </tbody>
                    </table>
                </div>

                <p class="report-footnote">
                    Privacy protection: groups with fewer than five students
                    are suppressed in the table and exported report. Do not
                    use this demonstration report to make operational decisions.
                    Counselling notes and individual counselling details are
                    not included.
                </p>
            </section>
        `;
    }

    function adminRenderReports() {
        const table = document.getElementById('admin-report-rows');
        const chart = document.querySelector('#reports-analytics .report-chart');

        if (table) table.innerHTML = adminReportTable();
        if (chart) chart.innerHTML = adminReportBars();
    }

    function adminDownloadCsv() {
        const rows = adminGetFilteredRows();

        if (!rows.length) {
            toast('There are no report rows to export.');
            return;
        }

        const csvCell = value => {
            let safe = String(value ?? '');

            // Prevent spreadsheet formula injection in exported text fields.
            if (/^[=+\-@\t\r]/.test(safe)) {
                safe = "'" + safe;
            }

            return '"' + safe.replace(/"/g, '""') + '"';
        };

        const csvRows = [
            ['Campus', 'Faculty', 'Year', 'Reported group'],
            ...rows.map(row => [
                row.campus,
                row.faculty,
                row.year,
                row.count < 5 ? 'Suppressed (<5)' : row.count + ' students'
            ])
        ];

        const csv = '\uFEFF' +
            csvRows.map(row => row.map(csvCell).join(',')).join('\r\n');

        const blob = new Blob([csv], {
            type: 'text/csv;charset=utf-8;'
        });

        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');

        link.href = url;
        link.download = 'careconnect-anonymised-campus-report.csv';
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);
        toast('Anonymised CSV report exported.');
    }

    function view() {
        return `
            <h2>Administrator</h2>

            <p class="admin-subtitle">
                Manage counsellor access and review CareConnect reports.
            </p>

            <section class="card" id="counsellor-management">
                <h3>Counsellor accounts</h3>

                ${S.cs.map((c, i) => `
                    <div class="row">
                        <span>
                            ${adminEscape(c.n)}
                            <div class="small">${adminEscape(c.e)}</div>
                        </span>

                        <span>
                            <button
                                class="pill"
                                style="background:${c.on ? 'var(--t)' : '#999'}"
                                data-ct="${i}"
                                type="button"
                            >
                                ${c.on ? 'Active' : 'Inactive'}
                            </button>

                            <button
                                class="pill"
                                style="background:#2f4f4a"
                                data-rp="${i}"
                                type="button"
                            >
                                Reset password
                            </button>
                        </span>
                    </div>
                `).join('')}

                <input
                    class="fld"
                    id="an"
                    placeholder="Full name"
                    style="margin-top:10px"
                    autocomplete="name"
                >

                <input
                    class="fld"
                    id="ae"
                    type="email"
                    placeholder="UNILUS email"
                    autocomplete="email"
                >

                <button class="btn" data-a="addc" type="button">
                    Add counsellor
                </button>
            </section>

            ${adminReportsMarkup()}

            <button class="btn o" data-a="chpw" type="button">
                Change password
            </button>

            <button class="btn o" data-a="logout" type="button">
                Log out
            </button>
        `;
    }

    function act(a) {
        if (a === 'export') {
            adminDownloadCsv();
        } else if (a === 'addc') {
            const nameInput = $('an');
            const emailInput = $('ae');

            const n = nameInput.value.trim();
            const e = emailInput.value.trim().toLowerCase();

            if (!n || !/^\S+@\S+\.\S+$/.test(e)) {
                return toast('Enter a name and a valid email.');
            }

            if (S.cs.some(c => c.e.toLowerCase() === e)) {
                return toast('That email already has an account.');
            }

            const temporaryPassword = mkTemp();

            S.cs.push({
                n,
                e,
                on: 1
            });

            S.acc[e] = {
                pw: temporaryPassword,
                role: 'c',
                codes: [],
                must: 1
            };

            render();
            tempModal(n, temporaryPassword);
        }
    }

    function after() {
        document.querySelectorAll('[data-ct]').forEach(button => {
            button.onclick = () => {
                const counsellor = S.cs[+button.dataset.ct];

                counsellor.on = !counsellor.on;

                toast(
                    counsellor.on
                        ? 'Account reactivated.'
                        : 'Account deactivated. They can no longer log in.'
                );

                render();
            };
        });

        document.querySelectorAll('[data-rp]').forEach(button => {
            button.onclick = () => resetFor(+button.dataset.rp);
        });

        const campusFilter = document.getElementById('admin-campus-filter');
        const facultyFilter = document.getElementById('admin-faculty-filter');
        const searchInput = document.getElementById('admin-report-search');

        if (campusFilter) {
            campusFilter.onchange = () => {
                ADMIN_REPORT_STATE.campus = campusFilter.value;
                adminRenderReports();
            };
        }

        if (facultyFilter) {
            facultyFilter.onchange = () => {
                ADMIN_REPORT_STATE.faculty = facultyFilter.value;
                adminRenderReports();
            };
        }

        if (searchInput) {
            searchInput.oninput = () => {
                ADMIN_REPORT_STATE.search = searchInput.value;
                adminRenderReports();
            };
        }

        document.querySelectorAll('[data-admin-report]').forEach(button => {
            button.onclick = () => {
                const action = button.dataset.adminReport;

                if (action === 'csv') {
                    adminDownloadCsv();
                } else if (action === 'print') {
                    window.print();
                } else if (action === 'reset') {
                    ADMIN_REPORT_STATE.campus = 'all';
                    ADMIN_REPORT_STATE.faculty = 'all';
                    ADMIN_REPORT_STATE.search = '';

                    render();
                }
            };
        });
    }

    CC.mount({
        role: 'a',
        title: 'Administrator',
        root: '../',
        view,
        act,
        after
    });
</script>
</body>
</html>
