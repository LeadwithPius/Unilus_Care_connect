<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UNILUS CareConnect · Administrator</title>
  <link rel="manifest" href="../../manifest.json">
  <meta name="theme-color" content="#134f47">
  <link rel="stylesheet" href="../../Frontend_Material/Shared/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet">
</head>
<body>
  <noscript><p style="padding:20px;font-family:sans-serif">CareConnect needs JavaScript. Enable JavaScript to use this portal.</p></noscript>
  <div class="phone" id="phone"></div>
  <script src="../../Frontend_Material/Shared/api.js"></script>
  <script src="../../Frontend_Material/Shared/core.js"></script>
  <script>
    function view() {
      return `<h2>Administrator</h2>
        <div class="card">
          <h3>Create counsellor account</h3>
          <p class="small">Create a real account in CareConnect. Set a temporary password of at least 12 characters and share it with the counsellor through a secure channel.</p>
          <label class="small" for="counsellor-name">Full name</label>
          <input class="fld" id="counsellor-name" autocomplete="name" placeholder="Counsellor full name">
          <label class="small" for="counsellor-email">UNILUS email</label>
          <input class="fld" id="counsellor-email" type="email" autocomplete="email" placeholder="name@unilus.ac.zm">
          <label class="small" for="counsellor-title">Professional title (optional)</label>
          <input class="fld" id="counsellor-title" placeholder="e.g. Counselling Psychologist">
          <label class="small" for="counsellor-password">Temporary password</label>
          <input class="fld" id="counsellor-password" type="password" autocomplete="new-password" placeholder="12 to 72 characters">
          <button class="btn" type="button" data-a="create-counsellor">Create counsellor</button>
        </div>
        <div class="card">
          <h3>Account management and reports</h3>
          <p class="small">Counsellor listing, activation/deactivation, deletion and anonymised reporting are not yet exposed by the backend. These features are intentionally not simulated or populated with demo records.</p>
        </div>
        <button class="btn o" type="button" data-a="logout">Log out</button>`;
    }

    async function act(action) {
      if (action !== 'create-counsellor') return;

      const displayName = document.getElementById('counsellor-name').value.trim();
      const email = document.getElementById('counsellor-email').value.trim().toLowerCase();
      const professionalTitle = document.getElementById('counsellor-title').value.trim();
      const password = document.getElementById('counsellor-password').value;

      if (!displayName || !email || !password) {
        toast('Enter the counsellor name, email and temporary password.');
        return;
      }
      if (!/^[^@\\s]+@(?:[a-z0-9-]+\\.)*unilus\\.ac\\.zm$/i.test(email)) {
        toast('Use a valid UNILUS email address.');
        return;
      }
      if (password.length < 12 || password.length > 72) {
        toast('The temporary password must contain 12 to 72 characters.');
        return;
      }

      const button = document.querySelector('[data-a="create-counsellor"]');
      button.disabled = true;
      try {
        await API.createCounsellor({ email, password, displayName, professionalTitle, biography: '' });
        document.getElementById('counsellor-name').value = '';
        document.getElementById('counsellor-email').value = '';
        document.getElementById('counsellor-title').value = '';
        document.getElementById('counsellor-password').value = '';
        toast('Counsellor account created. Share the temporary password securely.');
      } catch (error) {
        toast(error.message || 'Could not create the counsellor account.');
      } finally {
        if (button.isConnected) button.disabled = false;
      }
    }

    CC.mount({ role: 'a', title: 'Administrator', root: '../../', view, act });
  </script>
</body>
</html>
