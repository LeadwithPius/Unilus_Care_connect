<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNILUS CareConnect - Profile</title>
    <style>
        :root {
            --primary-emerald: #0D5C46;
            --accent-teal: #198275;
            --warm-sand: #FBF7F0;
            --coral-alert: #D94E3D;
            --dark-slate: #1A2E35;
            --card-bg: #FFFFFF;
        }
        body { font-family: system-ui, sans-serif; background-color: #F4F7F6; color: var(--dark-slate); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .phone-frame { width: 100%; max-width: 410px; height: 840px; background: var(--warm-sand); border-radius: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.12); overflow: hidden; border: 10px solid #111; display: flex; flex-direction: column; position: relative; }
        .status-bar { display: flex; justify-content: space-between; padding: 14px 24px; font-size: 13px; font-weight: 600; background: white; border-bottom: 1px solid #eee; }
        .screen-content { flex: 1; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .header-row { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); border: 1px solid #EAEFEA; }
        .btn { width: 100%; padding: 11px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 13px; background-color: var(--accent-teal); color: white; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #DDD; border-radius: 8px; margin-top: 4px; margin-bottom: 12px; box-sizing: border-box; font-size: 13px; }
        label { font-size: 11px; font-weight: bold; color: var(--primary-emerald); text-transform: uppercase; }
        .menu-icon { font-size: 22px; cursor: pointer; color: var(--primary-emerald); }

        /* Drawer styling reused */
        .drawer-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 200; display: none; }
        .drawer-overlay.open { display: block; }
        .drawer { position: absolute; top: 0; left: -280px; width: 270px; height: 100%; background: var(--primary-emerald); color: white; transition: left 0.3s; z-index: 210; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
        .drawer.open { left: 0; }
        .drawer-item { padding: 12px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; margin-bottom: 6px; display: flex; color: white; text-decoration: none; }
    </style>
</head>
<body>
<div class="phone-frame">
    <div class="status-bar"><span>9:41</span><span>Profile & Socials</span><span style="color:var(--coral-alert); font-weight:bold; cursor:pointer;" onclick="alert('SOS')">SOS</span></div>

    <!-- Drawer -->
    <div id="drawerOverlay" class="drawer-overlay" onclick="toggleDrawer()"></div>
    <div id="sideDrawer" class="drawer">
        <div>
            <h3 style="border-bottom:1px solid rgba(255,255,255,0.2); padding-bottom:12px;">🌿 Menu</h3>
            <a href="counsellor_dashboard.html" class="drawer-item">📊 Dashboard & Triage</a>
            <a href="counsellor_profile.html" class="drawer-item">👤 My Profile & Socials</a>
            <a href="student_progress.html" class="drawer-item">📈 Student Progress & Stats</a>
            <a href="counsellor_calendar.html" class="drawer-item">📅 Calendar & Google Sync</a>
        </div>
        <div class="drawer-item" onclick="alert('Logged out')" style="color:#ffb4b4;">🚪 Log Out</div>
    </div>

    <div class="screen-content">
        <div class="header-row">
            <span class="menu-icon" onclick="toggleDrawer()">☰</span>
            <h3 style="margin:0; color:var(--primary-emerald);">Counsellor Profile</h3>
        </div>

        <div class="card" style="text-align:center;">
            <div style="width:64px; height:64px; background:#E8F4F1; border-radius:50%; margin:0 auto 8px auto; display:flex; align-items:center; justify-content:center; font-size:24px;">👨‍⚕️</div>
            <h4 style="margin:0; color:var(--primary-emerald);">Mr. Lungu</h4>
            <small style="color:#666;">Senior Certified University Counsellor</small>
        </div>

        <div class="card">
            <label>Biography & Experience</label>
            <textarea rows="2">Specialized in adolescent psychology and cognitive behavioral therapy with 8+ years supporting university students.</textarea>

            <label>Upload Certification / License</label>
            <input type="file">

            <label>Social / Professional Links (Max 3)</label>
            <input type="text" placeholder="LinkedIn Profile URL">
            <input type="text" placeholder="ResearchGate Profile">
            <input type="text" placeholder="Professional Twitter / X">

            <button class="btn" onclick="alert('Profile updated successfully!')">Save Changes</button>
        </div>
    </div>
</div>
<script>function toggleDrawer() { document.getElementById('sideDrawer').classList.toggle('open'); document.getElementById('drawerOverlay').classList.toggle('open'); }</script>
</body>
</html>
