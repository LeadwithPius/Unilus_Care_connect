<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#134f47">
    <title>UNILUS CareConnect · My profile</title>
    <link rel="manifest" href="../../manifest.json">
    <link rel="stylesheet" href="../Shared_Material/styles.css">
</head>
<body>
<noscript><p style="padding:20px;font-family:sans-serif">CareConnect needs JavaScript. Open this page in a supported browser.</p></noscript>
<div class="phone" id="phone"></div>
<script src="../Shared_Material/api.js"></script>
<script src="../Shared_Material/core.js"></script>
<script src="../Shared_Material/care_data.js"></script>
<script src="../Shared_Material/emergency_hotline.js"></script>
<script src="../Shared_Material/password_tools.js"></script>
<script>
'use strict';

const counsellorProfileState = {
    displayName: '',
    professionalTitle: '',
    biography: '',
    loaded: false,
    loading: false,
    error: ''
};

function profileEscape(value) {
    return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[character]);
}

async function loadCounsellorProfile(force = false) {
    if (counsellorProfileState.loading ||
        (counsellorProfileState.loaded && !force)) return;

    counsellorProfileState.loading = true;
    counsellorProfileState.error = '';
    try {
        const profile = await API.counsellorProfile();
        counsellorProfileState.displayName = profile.displayName || '';
        counsellorProfileState.professionalTitle = profile.professionalTitle || '';
        counsellorProfileState.biography = profile.biography || '';
        counsellorProfileState.loaded = true;
    } catch (error) {
        counsellorProfileState.error = error.message || 'Could not load your profile.';
    } finally {
        counsellorProfileState.loading = false;
        if (window.PAGE?.title === 'My profile & socials') render();
    }
}

function view() {
    if (!counsellorProfileState.loaded) {
        return '<h2>My profile</h2><div class="card">' +
            (counsellorProfileState.loading ? 'Loading your saved profile…' :
             profileEscape(counsellorProfileState.error || 'Loading your profile…')) +
            '<button class="btn o" data-a="retry">Retry</button></div>';
    }

    return `
        <h2>My profile</h2>
        <p class="small">Keep your professional details up to date. Students see these details when choosing a counsellor.</p>
        <form class="card" id="counsellor-profile-form">
            <label class="small" for="profile-name">Full name</label>
            <input class="fld" id="profile-name" name="displayName"
                   maxlength="150" required autocomplete="name"
                   value="${profileEscape(counsellorProfileState.displayName)}">

            <label class="small" for="profile-title">Professional title</label>
            <input class="fld" id="profile-title" name="professionalTitle"
                   maxlength="150" placeholder="e.g. Registered Counsellor"
                   value="${profileEscape(counsellorProfileState.professionalTitle)}">

            <label class="small" for="profile-biography">Professional biography</label>
            <textarea class="fld" id="profile-biography" name="biography"
                      maxlength="5000" rows="5"
                      placeholder="Briefly describe your experience and areas of support…">${profileEscape(counsellorProfileState.biography)}</textarea>

            <button class="btn" type="submit" id="save-profile">Save profile</button>
            <p class="small">Changes are saved to your CareConnect account and will remain after you log out.</p>
        </form>
        ${counsellorProfileState.error
            ? `<div class="card"><p class="small">${profileEscape(counsellorProfileState.error)}</p></div>`
            : ''}
    `;
}

async function act(action) {
    if (action === 'retry') {
        counsellorProfileState.loaded = false;
        await loadCounsellorProfile(true);
    }
}

function after() {
    const form = document.getElementById('counsellor-profile-form');
    if (form) {
        form.onsubmit = async event => {
            event.preventDefault();
            const button = document.getElementById('save-profile');
            button.disabled = true;
            button.textContent = 'Saving…';

            try {
                const result = await API.updateCounsellorProfile({
                    displayName: document.getElementById('profile-name').value,
                    professionalTitle: document.getElementById('profile-title').value,
                    biography: document.getElementById('profile-biography').value
                });
                counsellorProfileState.displayName = result.displayName || '';
                counsellorProfileState.professionalTitle = result.professionalTitle || '';
                counsellorProfileState.biography = result.biography || '';
                counsellorProfileState.error = '';
                toast(result.message || 'Profile saved successfully.');
                render();
            } catch (error) {
                button.disabled = false;
                button.textContent = 'Save profile';
                toast(error.message || 'Could not save your profile.');
            }
        };
    }

    if (!counsellorProfileState.loaded && !counsellorProfileState.loading) {
        loadCounsellorProfile();
    }
}

CC.mount({
    role: 'c',
    title: 'My profile & socials',
    root: '../',
    view,
    act,
    after
});
</script>
</body>
</html>
