<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNILUS CareConnect · Counsellor dashboard</title>
<link rel="manifest" href="../../manifest.json"><meta name="theme-color" content="#134f47">
<link rel="stylesheet" href="../../Frontend_Material/Shared/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet">
</head><body>
<noscript><p style="padding:20px;font-family:sans-serif">CareConnect needs JavaScript. Open this page in Safari or Chrome.</p></noscript>
<div class="phone" id="phone"></div>
<script src="../../Frontend_Material/Shared/api.js"></script>
<script src="../../Frontend_Material/Shared/core.js"></script>
<script src="../../Frontend_Material/Shared/care_data.js"></script>
<script src="../../Frontend_Material/Shared/emergency_session.js"></script>
<script src="../../Frontend_Material/Shared/password_tools.js"></script>
<script>
// Counsellor dashboard: availability, emergency control, priority triage queue, attendance log.
 function view(){const ownCounsellor=counsellorBookingIndex(),ownStatus=ownCounsellor>=0?cstat(ownCounsellor):null,ownsBooking=ownCounsellor>=0&&S.booked&&S.cns===CNS[ownCounsellor].n;return `<div style="display:flex;gap:10px;align-items:center;margin-bottom:12px"><h2 style="margin:0">Welcome back, ${S.name}</h2></div>
 <div class="card"><h3>Your availability</h3><div class="small">Students see this when choosing you.</div>${ownStatus?`<div style="margin:8px 0"><span class="pill" style="background:${ownStatus[1]}">${ownStatus[0]}</span> <span class="small">${ownStatus[2]}</span></div><button class="btn o" data-a="avail">${S.counsellorAvailability[CNS[ownCounsellor].n]==='AWAY'?'Set me as available':'Set me as away'}</button>`:'<div class="small" style="margin-top:8px">No student booking profile is linked to this account.</div>'}</div>
 <div class="card" style="background:#fbeeea;border-color:#e8c4b9"><h3 style="color:var(--r)">⚠ Emergency schedule control</h3><div class="small">${S.frozen?'Slots are frozen. Affected students were sent rebooking alerts.':'Freeze upcoming slots instantly and send auto-rebooking alerts.'}</div><button class="btn r" data-a="freeze">${S.frozen?'Resume schedule':'Trigger emergency mode'}</button></div>
 <div class="card"><h3>Student bookings</h3>
 ${S.prioritySessions.map((session,index)=>({session,index})).filter(({session})=>ownCounsellor>=0&&session.cns===CNS[ownCounsellor].n).map(({session,index})=>`<div class="row"><div><b class="priority-session-heading">Priority session · ${session.date} at ${session.time}</b><div class="small">${session.attendanceStatus==='attended'?'Attended':session.attendanceStatus==='no-show'?'No-show':'Attendance not recorded'}</div></div>${session.attendanceStatus?'':`<div><button class="pill" style="background:var(--g);margin:3px" data-a="priority-attended-${index}">Attended</button><button class="pill" style="background:var(--r);margin:3px" data-a="priority-noshow-${index}">No-show</button></div>`}</div>`).join('')}
 ${ownsBooking?`<div class="row"><div><b>${S.slot} · Student booking</b><div class="small">${S.cat} (${S.mode})</div>${S.bookingStatus==='pending'?'<div class="small" style="color:var(--o)">Awaiting your approval</div>':`<div class="small">${S.attendanceStatus==='attended'?'Attended':S.attendanceStatus==='no-show'?'No-show':'Attendance not recorded'}</div>`}${S.mode!=='Face-to-Face'&&S.why?`<div class="small">Reason: ${S.why}</div>`:''}${S.transfers>=3?`<div class="small" style="color:var(--r)">Continuity flag: moved ${S.transfers} times</div>`:''}</div>${S.bookingStatus==='pending'?'<div><button class="pill" style="background:var(--g);margin:3px" data-a="approve">Approve</button><button class="pill" style="background:var(--r);margin:3px" data-a="deny">Decline</button></div>':S.attendanceStatus?'':'<div><button class="pill" style="background:var(--g);margin:3px" data-a="attended">Attended</button><button class="pill" style="background:var(--r);margin:3px" data-a="noshow">No-show</button></div>'}</div>`:''}
 ${!ownsBooking&&!S.prioritySessions.some(session=>ownCounsellor>=0&&session.cns===CNS[ownCounsellor].n)?'<div class="small">No student bookings yet.</div>':''}</div>
 ${S.noshow.length?`<div class="card"><h3>Attendance log</h3>${S.noshow.map(n=>`<div class="small">${n}</div>`).join('')}</div>`:''}`}
function act(a){
 if(a==='avail'){const i=counsellorBookingIndex();if(i<0)return toast('No student booking profile is linked to this account.');const n=CNS[i].n;S.counsellorAvailability[n]=S.counsellorAvailability[n]==='AWAY'?'AVAILABLE':'AWAY';toast(S.counsellorAvailability[n]==='AWAY'?'You are shown as away to students.':'You are shown as available to students.');render()}
 else if(a==='freeze'){S.frozen=!S.frozen;if(S.frozen&&S.booked)S.transfers++;toast(S.frozen?'Emergency mode on. Rebooking alerts sent.':'Schedule resumed.');render()}
 else if(a==='approve'){const i=counsellorBookingIndex();if(i<0||!S.booked||S.cns!==CNS[i].n||S.bookingStatus!=='pending')return;S.bookingStatus='approved';toast('Request approved. The student can now arrange a time.');render()}
 else if(a==='deny'){const i=counsellorBookingIndex();if(i<0||!S.booked||S.cns!==CNS[i].n||S.bookingStatus!=='pending')return;S.booked=false;S.bookingStatus='denied';S.why='';S.appointmentDate=S.appointmentTime='';toast('Request declined.');render()}
 else if(a==='attended'||a==='noshow'){const i=counsellorBookingIndex();if(i<0||!S.booked||S.cns!==CNS[i].n||S.bookingStatus!=='approved'||S.attendanceStatus)return;S.attendanceStatus=a==='attended'?'attended':'no-show';if(a==='noshow')S.noshow.push(S.slot+' #N22');toast(a==='attended'?'Attendance recorded.':'Logged as no-show.');render()}
 else if(a.startsWith('priority-attended-')||a.startsWith('priority-noshow-')){const i=counsellorBookingIndex(),sessionIndex=Number(a.slice(a.lastIndexOf('-')+1)),session=S.prioritySessions[sessionIndex];if(i<0||!session||session.cns!==CNS[i].n||session.attendanceStatus)return;session.attendanceStatus=a.startsWith('priority-attended-')?'attended':'no-show';if(session.attendanceStatus==='no-show')S.noshow.push(`${session.date} ${session.time} · Priority student`);toast(session.attendanceStatus==='attended'?'Attendance recorded.':'Logged as no-show.');render()}
}
CC.mount({role:'c',title:'Counsellor dashboard',root:'../../',view,act});
</script></body></html>
