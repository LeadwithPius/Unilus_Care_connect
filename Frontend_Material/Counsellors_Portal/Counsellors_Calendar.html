<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNILUS CareConnect · Calendar</title>
<link rel="manifest" href="../../manifest.json"><meta name="theme-color" content="#134f47">
<link rel="stylesheet" href="../../Frontend_Material/Shared/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet">
</head><body>
<noscript><p style="padding:20px;font-family:sans-serif">CareConnect needs JavaScript. Open this page in Safari or Chrome.</p></noscript>
<div class="phone" id="phone"></div>
<script src="../../Frontend_Material/Shared/api.js"></script>
<script src="../../Frontend_Material/Shared/core.js"></script>
<script src="../../Frontend_Material/Shared/care_data.js"></script>
<script src="../../Frontend_Material/Shared/emergency_session.js"></script>
<script src="../../Frontend_Material/Shared/password_tools.js"></script>
<script>
// Calendar: show this counsellor's student bookings only.
function view(){
 const ownCounsellor=counsellorBookingIndex(),ownName=ownCounsellor>=0?CNS[ownCounsellor].n:'';
 const today=new Date(),currentMonth=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
 if(!S.counsellorCalendarMonth||!/^\d{4}-\d{2}$/.test(S.counsellorCalendarMonth))S.counsellorCalendarMonth=currentMonth;
 const [year,month]=S.counsellorCalendarMonth.split('-').map(Number);
 const events=[
  ...(S.booked&&S.cns===ownName?[{date:S.appointmentDate||'',time:S.appointmentTime||'Time to be arranged',label:`${S.cat} session`,status:S.bookingStatus==='pending'?'Awaiting approval':S.attendanceStatus==='attended'?'Attended':S.attendanceStatus==='no-show'?'No-show':'Booked'}]:[]),
  ...(S.prioritySessions||[]).filter(session=>session.cns===ownName).map(session=>({date:session.date,time:session.time,label:'Priority session',status:session.attendanceStatus==='attended'?'Attended':session.attendanceStatus==='no-show'?'No-show':'Booked'}))
 ].sort((a,b)=>`${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`));
 const monthEvents=events.filter(event=>event.date.startsWith(S.counsellorCalendarMonth));
 const unscheduledEvents=events.filter(event=>!event.date);
 const firstDay=(new Date(year,month-1,1).getDay()+6)%7,daysInMonth=new Date(year,month,0).getDate();
 const dayCells=Array(firstDay).fill('<div class="empty"></div>').join('')+Array.from({length:daysInMonth},(_,index)=>{
  const day=index+1,date=`${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  const booked=monthEvents.some(event=>event.date===date);
  return `<div class="${booked?'b':''}"${booked?' aria-label="Booked"':''}>${day}</div>`;
 }).join('');
 const previousMonth=month===1?`${year-1}-12`:`${year}-${String(month-1).padStart(2,'0')}`;
 const nextMonth=month===12?`${year+1}-01`:`${year}-${String(month+1).padStart(2,'0')}`;
 const monthLabel=new Date(year,month-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'});
 const bookingRows=monthEvents.map(event=>`<div class="row"><span>${event.label}<div class="small">${event.date?`${new Date(`${event.date}T12:00:00`).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})} · `:''}${event.time} · ${event.status}</div></span></div>`).join('');
 return `<h2>Calendar</h2><div class="card"><div class="calendar-month-heading"><button type="button" data-month="${previousMonth}" aria-label="Previous month">‹</button><b>${monthLabel}</b><button type="button" data-month="${nextMonth}" aria-label="Next month">›</button></div><div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(day=>`<div class="h">${day}</div>`).join('')}${dayCells}</div><div class="small" style="margin-top:8px">Booked dates are highlighted.</div></div><div class="card"><h3>Student bookings</h3>${ownCounsellor<0?'<div class="small">No student booking profile is linked to this account.</div>':bookingRows+unscheduledEvents.map(event=>`<div class="row"><span>${event.label}<div class="small">${event.time} · ${event.status}</div></span></div>`).join('')||'<div class="small">No bookings for this month.</div>'}</div>`;
}
function after(){document.querySelectorAll('[data-month]').forEach(button=>button.onclick=()=>{S.counsellorCalendarMonth=button.dataset.month;save();render()})}
CC.mount({role:'c',title:'Calendar',root:'../../',view,act(){},after});
</script></body></html>
