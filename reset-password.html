<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset your CareConnect password</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="Frontend_Material/Shared/styles.css"></head>
<body><main class="phone" style="max-width:520px;margin:8vh auto;padding:24px"><h2>Choose a new password</h2>
<p class="small">Use a password between 12 and 72 characters.</p>
<label class="small" for="password">New password</label><input class="fld" id="password" type="password" autocomplete="new-password">
<label class="small" for="confirm">Confirm new password</label><input class="fld" id="confirm" type="password" autocomplete="new-password">
<button class="btn" id="submit" type="button">Reset password</button><p id="status" class="small" role="status"></p><a class="btn o" href="login.html">Back to login</a></main>
<script src="Frontend_Material/Shared/api.js"></script>
<script>
document.getElementById('submit').addEventListener('click',async()=>{
 const status=document.getElementById('status'),password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;
 const token=new URLSearchParams(location.search).get('token');
 if(!token){status.textContent='This reset link is missing its token.';return;}
 if(password.length<12||password.length>72){status.textContent='Password must contain between 12 and 72 characters.';return;}
 if(password!==confirm){status.textContent='The passwords do not match.';return;}
 const button=document.getElementById('submit');button.disabled=true;
 try{const result=await API.resetPassword(token,password);status.textContent=result&&result.message?result.message:'Your password has been reset successfully.';}
 catch(error){status.textContent=error.message||'The reset link is invalid or has expired.';}
 finally{button.disabled=false;}
});
</script></body></html>
